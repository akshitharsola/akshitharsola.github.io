<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.summary | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
    <nav>
      <a href="{{ '/#projects' | relative_url }}">Projects</a>
      <a href="https://github.com/{{ site.author.github }}">GitHub</a>
      <a href="{{ site.author.linkedin }}">LinkedIn</a>
    </nav>
  </header>
  <main>{{ content }}</main>
  <footer class="site-footer">© {{ site.time | date: "%Y" }} {{ site.author.name }}</footer>
  {% include mermaid.html %}
</body>
</html>
